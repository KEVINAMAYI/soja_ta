name: 🚀 Deploy Laravel (Dev, Kenya Prod, Uganda Prod)

on:
  push:
    branches:
      - development
      - master
      - production-ug

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      # =============================
      # 🌱 Deploy to Development
      # =============================
      - name: 🚀 Deploy to Development (dev.ta.soja.co.ke)
        if: github.ref == 'refs/heads/development'
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_KEY }}
          script: |
            set -e
            echo "🚀 Deploying to Development Server..."
            cd /var/www/dev.ta.soja.co.ke

            echo "🔧 Setting temporary permissions..."
            sudo chown -R $USER:$USER .

            echo "📥 Updating code..."
            git fetch origin development
            git reset --hard origin/development

            echo "🧹 Cleaning vendor and caches..."
            rm -rf vendor bootstrap/cache/*.php

            echo "📦 Installing dependencies..."
            export COMPOSER_ALLOW_SUPERUSER=1
            composer install --no-interaction --prefer-dist --optimize-autoloader
            composer dump-autoload -o

            echo "🧱 Running migrations..."
            php artisan migrate --force || true

            echo "⚡ Clearing and rebuilding caches..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            echo "🎨 Building frontend (if applicable)..."
            if [ -f package.json ]; then
              npm ci --omit=dev || npm install
              npm run build || true
            fi

            echo "🔐 Restoring correct permissions..."
            sudo chown -R www-data:www-data storage bootstrap/cache public
            sudo chmod -R 775 storage bootstrap/cache public

            echo "✅ Development deployment complete!"

      # =============================
      # 🇰🇪 Deploy to Kenya Production
      # =============================
      - name: 🚀 Deploy to Kenya Production (ta.soja.co.ke)
        if: github.ref == 'refs/heads/master'
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.KENYA_HOST }}
          username: ${{ secrets.KENYA_USER }}
          key: ${{ secrets.KENYA_KEY }}
          port: ${{ secrets.KENYA_PORT }}
          script: |
            set -e
            echo "🚀 Deploying to Kenya Production..."
            cd /var/www/v2.ta.soja.co.ke

            echo "🔧 Setting temporary permissions..."
            sudo chown -R $USER:$USER .

            echo "📥 Updating code..."
            git fetch origin master
            git reset --hard origin/master

            echo "🧹 Cleaning vendor and cache..."
            rm -rf vendor bootstrap/cache/*.php

            echo "📦 Installing composer dependencies (prod)..."
            export COMPOSER_ALLOW_SUPERUSER=1
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            composer dump-autoload -o

            echo "🧱 Running migrations..."
            php artisan migrate --force || true

            echo "⚡ Rebuilding caches..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            echo "🎨 Building production frontend..."
            if [ -f package.json ]; then
              npm ci --omit=dev || npm install
              npm run build || true
            fi

            echo "🔐 Restoring ownership..."
            sudo chown -R www-data:www-data storage bootstrap/cache public
            sudo chmod -R 775 storage bootstrap/cache public

            echo "✅ Kenya Production deployment complete!"

      # =============================
      # 🇺🇬 Deploy to Uganda Production
      # =============================
      - name: 🚀 Deploy to Uganda Production (ta.soja.co.ug)
        if: github.ref == 'refs/heads/production-ug'
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.UGANDA_HOST }}
          username: ${{ secrets.UGANDA_USER }}
          key: ${{ secrets.UGANDA_KEY }}
          script: |
            set -e
            echo "🚀 Deploying to Uganda Production..."
            cd /var/www/ta.soja.co.ug

            echo "🔧 Setting temporary permissions..."
            sudo chown -R $USER:$USER .

            echo "📥 Updating code..."
            git fetch origin production-ug
            git reset --hard origin/production-ug

            echo "🧹 Cleaning vendor and cache..."
            rm -rf vendor bootstrap/cache/*.php

            echo "📦 Installing composer dependencies (prod)..."
            export COMPOSER_ALLOW_SUPERUSER=1
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            composer dump-autoload -o

            echo "🧱 Running migrations..."
            php artisan migrate --force || true

            echo "⚡ Rebuilding caches..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            echo "🎨 Building production frontend..."
            if [ -f package.json ]; then
              npm ci --omit=dev || npm install
              npm run build || true
            fi

            echo "🔐 Restoring permissions..."
            sudo chown -R www-data:www-data storage bootstrap/cache public
            sudo chmod -R 775 storage bootstrap/cache public

            echo "✅ Uganda Production deployment complete!"
