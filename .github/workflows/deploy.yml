name: Deploy Laravel to Development, Kenya Production, and Uganda Production Servers

on:
  push:
    branches:
      - development
      - master
      - production-ug

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v4

      # =============================
      # 🚀 DEPLOY TO DEVELOPMENT
      # =============================
      - name: 🚀 Deploy to Development (dev.ta.soja.co.ke)
        if: github.ref == 'refs/heads/development'
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_KEY }}
          script: |
            echo "🚀 Starting deployment on Development server..."
            cd /var/www/dev.ta.soja.co.ke

            echo "📥 Pulling latest code..."
            git fetch origin development
            git reset --hard origin/development

            echo "🔧 Setting ownership..."
            chown -R $USER:$USER .

            echo "📦 Installing composer dependencies..."
            if [ -f composer.lock ]; then
              composer install --no-interaction --prefer-dist --optimize-autoloader || composer update --no-interaction --prefer-dist --optimize-autoloader
            else
              composer update --no-interaction --prefer-dist --optimize-autoloader
            fi

            echo "🧱 Running migrations..."
            php artisan migrate --force || true

            echo "⚡ Clearing and optimizing Laravel caches..."
            php artisan optimize:clear || true
            php artisan config:clear || true
            php artisan route:clear || true
            php artisan view:clear || true
            php artisan cache:clear || true
            php artisan event:clear || true
            php artisan optimize || true

            echo "🔒 Fixing permissions for Laravel writable directories..."
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            echo "✅ Development deployment successful!"

      # =============================
      # 🇰🇪 DEPLOY TO KENYA PRODUCTION
      # =============================
      - name: 🚀 Deploy to Kenya Production (ta.soja.co.ke)
        if: github.ref == 'refs/heads/master'
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.KENYA_HOST }}
          username: ${{ secrets.KENYA_USER }}
          key: ${{ secrets.KENYA_KEY }}
          port: ${{ secrets.KENYA_PORT }}
          script: |
            echo "🚀 Starting deployment on Kenya Production server..."
            cd /var/www/v2.ta.soja.co.ke

            echo "📥 Pulling latest code..."
            git fetch origin master
            git reset --hard origin/master

            echo "🔧 Setting ownership..."
            chown -R $USER:$USER .

            echo "📦 Installing composer dependencies..."
            if [ -f composer.lock ]; then
              composer install --no-interaction --prefer-dist --optimize-autoloader || composer update --no-interaction --prefer-dist --optimize-autoloader
            else
              composer update --no-interaction --prefer-dist --optimize-autoloader
            fi

            echo "🧱 Running migrations..."
            php artisan migrate --force || true

            echo "⚡ Clearing and optimizing Laravel caches..."
            php artisan optimize:clear || true
            php artisan config:clear || true
            php artisan route:clear || true
            php artisan view:clear || true
            php artisan cache:clear || true
            php artisan event:clear || true
            php artisan optimize || true

            echo "🔒 Fixing permissions for Laravel writable directories..."
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            echo "✅ Kenya production deployment successful!"

      # =============================
      # 🇺🇬 DEPLOY TO UGANDA PRODUCTION
      # =============================
      - name: 🚀 Deploy to Uganda Production (ta.soja.co.ug)
        if: github.ref == 'refs/heads/production-ug'
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.UGANDA_HOST }}
          username: ${{ secrets.UGANDA_USER }}
          key: ${{ secrets.UGANDA_KEY }}
          script: |
            echo "🚀 Starting deployment on Uganda Production server..."
            cd /var/www/ta.soja.co.ug

            echo "📥 Pulling latest code..."
            git fetch origin production-ug
            git reset --hard origin/production-ug

            echo "🔧 Setting ownership..."
            chown -R $USER:$USER .

            echo "📦 Installing composer dependencies..."
            if [ -f composer.lock ]; then
              composer install --no-interaction --prefer-dist --optimize-autoloader || composer update --no-interaction --prefer-dist --optimize-autoloader
            else
              composer update --no-interaction --prefer-dist --optimize-autoloader
            fi

            echo "🧱 Running migrations..."
            php artisan migrate --force || true

            echo "⚡ Clearing and optimizing Laravel caches..."
            php artisan optimize:clear || true
            php artisan config:clear || true
            php artisan route:clear || true
            php artisan view:clear || true
            php artisan cache:clear || true
            php artisan event:clear || true
            php artisan optimize || true

            echo "🔒 Fixing permissions for Laravel writable directories..."
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            echo "✅ Uganda production deployment successful!"
