name: Deploy Laravel to Development, Kenya Production, and Uganda Production Servers

on:
  push:
    branches:
      - development
      - master
      - production-ug

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v4

      # =============================
      # 🚀 Deploy to Development
      # =============================
      - name: 🚀 Deploy to Development (dev.ta.soja.co.ke)
        if: github.ref == 'refs/heads/development'
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_KEY }}
          script: |
            echo "🚀 Starting deployment on Development server..."
            cd /var/www/dev.ta.soja.co.ke

            echo "🔧 Fixing permissions temporarily..."
            sudo chown -R $USER:$USER .

            echo "📥 Pulling latest code..."
            git fetch origin development
            git reset --hard origin/development

            echo "🧹 Removing old vendor and caches..."
            rm -rf vendor/ bootstrap/cache/*.php

            echo "📦 Running full composer update (fresh deps + autoload rebuild)..."
            COMPOSER_ALLOW_SUPERUSER=1 composer update --no-interaction --prefer-dist --optimize-autoloader --no-self-update
            composer dump-autoload -o

            echo "🧱 Running database migrations..."
            php artisan migrate --force || true

            echo "⚡ Clearing and rebuilding Laravel caches..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            echo "🎨 Building frontend assets (if package.json exists)..."
            if [ -f package.json ]; then
              npm ci --omit=dev || npm install
              npm run build || true
            fi

            echo "🔧 Restoring correct ownership..."
            sudo chown -R www-data:www-data storage bootstrap/cache public
            sudo chmod -R 775 storage bootstrap/cache public

            echo "✅ Development deployment successful!"

      # =============================
      # 🚀 Deploy to Kenya Production
      # =============================
      - name: 🚀 Deploy to Kenya Production (ta.soja.co.ke)
        if: github.ref == 'refs/heads/master'
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.KENYA_HOST }}
          username: ${{ secrets.KENYA_USER }}
          key: ${{ secrets.KENYA_KEY }}
          port: ${{ secrets.KENYA_PORT }}
          script: |
            echo "🚀 Starting deployment on Kenya Production server..."
            cd /var/www/v2.ta.soja.co.ke

            echo "🔧 Adjusting permissions temporarily..."
            sudo chown -R $USER:$USER .

            echo "📥 Pulling latest code..."
            git fetch origin master
            git reset --hard origin/master

            echo "🧹 Cleaning vendor and Laravel cache..."
            rm -rf vendor/ bootstrap/cache/*.php

            echo "📦 Running composer update (production mode)..."
            COMPOSER_ALLOW_SUPERUSER=1 composer update --no-interaction --prefer-dist --optimize-autoloader --no-dev --no-self-update
            composer dump-autoload -o

            echo "🧱 Running migrations..."
            php artisan migrate --force || true

            echo "⚡ Rebuilding caches..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            echo "🎨 Building production frontend assets..."
            if [ -f package.json ]; then
              npm ci --omit=dev || npm install
              npm run build || true
            fi

            echo "🔧 Restoring ownership for web server..."
            sudo chown -R www-data:www-data storage bootstrap/cache public
            sudo chmod -R 775 storage bootstrap/cache public

            echo "✅ Kenya production deployment successful!"

      # =============================
      # 🚀 Deploy to Uganda Production
      # =============================
      - name: 🚀 Deploy to Uganda Production (ta.soja.co.ug)
        if: github.ref == 'refs/heads/production-ug'
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.UGANDA_HOST }}
          username: ${{ secrets.UGANDA_USER }}
          key: ${{ secrets.UGANDA_KEY }}
          script: |
            echo "🚀 Starting deployment on Uganda Production server..."
            cd /var/www/ta.soja.co.ug

            echo "🔧 Adjusting permissions temporarily..."
            sudo chown -R $USER:$USER .

            echo "📥 Pulling latest code..."
            git fetch origin production-ug
            git reset --hard origin/production-ug

            echo "🧹 Cleaning vendor and cache..."
            rm -rf vendor/ bootstrap/cache/*.php

            echo "📦 Running composer update (production mode)..."
            COMPOSER_ALLOW_SUPERUSER=1 composer update --no-interaction --prefer-dist --optimize-autoloader --no-dev --no-self-update
            composer dump-autoload -o

            echo "🧱 Running migrations..."
            php artisan migrate --force || true

            echo "⚡ Rebuilding caches..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            echo "🎨 Building frontend assets..."
            if [ -f package.json ]; then
              npm ci --omit=dev || npm install
              npm run build || true
            fi

            echo "🔧 Restoring ownership for web server..."
            sudo chown -R www-data:www-data storage bootstrap/cache public
            sudo chmod -R 775 storage bootstrap/cache public

            echo "✅ Uganda production deployment successful!"
