name: Deploy Laravel to Development, Kenya Production, and Uganda Production Servers

on:
  push:
    branches:
      - development
      - master
      - production-ug

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v4

      - name: ✅ Validate composer lock consistency
        run: composer validate --strict

      # =============================
      # 🚀 Deploy to Development
      # =============================
      - name: 🚀 Deploy to Development (dev.ta.soja.co.ke)
        if: github.ref == 'refs/heads/development'
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_KEY }}
          script: |
            echo "🚀 Starting deployment on Development server..."
            cd /var/www/dev.ta.soja.co.ke

            echo "🔧 Taking ownership temporarily for deployment..."
            sudo chown -R $USER:$USER .

            echo "📥 Pulling latest code..."
            git fetch origin development
            git reset --hard origin/development

            echo "🧹 Cleaning vendor directory for fresh dependency sync..."
            rm -rf vendor/

            echo "📦 Installing composer dependencies..."
            composer install --no-interaction --prefer-dist --optimize-autoloader || {
              echo "⚙️ Composer install failed — attempting automatic repair with composer update..."
              composer update --no-interaction --prefer-dist --optimize-autoloader
            }

            echo "🧱 Running migrations..."
            php artisan migrate --force || true

            echo "⚡ Clearing and rebuilding caches..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            echo "🎨 Building frontend assets (if package.json exists)..."
            if [ -f package.json ]; then
              npm ci --omit=dev || npm install
              npm run build || true
            fi

            echo "🔧 Returning permissions to web server..."
            sudo chown -R www-data:www-data storage bootstrap/cache public
            sudo chmod -R 775 storage bootstrap/cache public

            echo "✅ Development deployment successful!"

      # =============================
      # 🚀 Deploy to Kenya Production
      # =============================
      - name: 🚀 Deploy to Kenya Production (ta.soja.co.ke)
        if: github.ref == 'refs/heads/master'
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.KENYA_HOST }}
          username: ${{ secrets.KENYA_USER }}
          key: ${{ secrets.KENYA_KEY }}
          port: ${{ secrets.KENYA_PORT }}
          script: |
            echo "🚀 Starting deployment on Kenya Production server..."
            cd /var/www/v2.ta.soja.co.ke

            echo "🔧 Taking ownership temporarily for deployment..."
            sudo chown -R $USER:$USER .

            echo "📥 Pulling latest code..."
            git fetch origin master
            git reset --hard origin/master

            echo "🧹 Cleaning vendor directory for a fresh install..."
            rm -rf vendor/

            echo "📦 Installing composer dependencies..."
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev || {
              echo "⚙️ Composer install failed — attempting automatic repair with composer update..."
              composer update --no-interaction --prefer-dist --optimize-autoloader --no-dev
            }

            echo "🧱 Running migrations..."
            php artisan migrate --force || true

            echo "⚡ Clearing and rebuilding Laravel caches..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            echo "🎨 Building frontend assets..."
            if [ -f package.json ]; then
              npm ci --omit=dev || npm install
              npm run build || true
            fi

            echo "🔧 Restoring ownership to www-data..."
            sudo chown -R www-data:www-data storage bootstrap/cache public
            sudo chmod -R 775 storage bootstrap/cache public

            echo "✅ Kenya production deployment successful!"

      # =============================
      # 🚀 Deploy to Uganda Production
      # =============================
      - name: 🚀 Deploy to Uganda Production (ta.soja.co.ug)
        if: github.ref == 'refs/heads/production-ug'
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.UGANDA_HOST }}
          username: ${{ secrets.UGANDA_USER }}
          key: ${{ secrets.UGANDA_KEY }}
          script: |
            echo "🚀 Starting deployment on Uganda Production server..."
            cd /var/www/ta.soja.co.ug

            echo "🔧 Taking ownership temporarily for deployment..."
            sudo chown -R $USER:$USER .

            echo "📥 Pulling latest code..."
            git fetch origin production-ug
            git reset --hard origin/production-ug

            echo "🧹 Cleaning vendor directory for a fresh install..."
            rm -rf vendor/

            echo "📦 Installing composer dependencies..."
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev || {
              echo "⚙️ Composer install failed — attempting automatic repair with composer update..."
              composer update --no-interaction --prefer-dist --optimize-autoloader --no-dev
            }

            echo "🧱 Running migrations..."
            php artisan migrate --force || true

            echo "⚡ Clearing and rebuilding Laravel caches..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            echo "🎨 Building frontend assets..."
            if [ -f package.json ]; then
              npm ci --omit=dev || npm install
              npm run build || true
            fi

            echo "🔧 Restoring ownership to www-data..."
            sudo chown -R www-data:www-data storage bootstrap/cache public
            sudo chmod -R 775 storage bootstrap/cache public

            echo "✅ Uganda production deployment successful!"
