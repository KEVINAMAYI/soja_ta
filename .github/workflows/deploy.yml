name: Deploy Laravel to Development/Kenya Production and Uganda Production Servers

on:
  push:
    branches:
      - master
      - development
      - production-ug

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------- DEV DEPLOYMENT ----------------
      - name: Deploy to Development (dev.soja.co.ke)
        if: github.ref == 'refs/heads/development'
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_KEY }}
          script: |
            cd /var/www/dev.ta.soja.co.ke
            git fetch origin development
            git reset --hard origin/development

            # Ensure proper permissions before running anything
            sudo chown -R $USER:www-data storage bootstrap/cache
            sudo chmod -R ug+rwx storage bootstrap/cache

            composer install --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:clear

            # Reset permissions again after build
            sudo chown -R $USER:www-data storage bootstrap/cache
            sudo chmod -R ug+rwx storage bootstrap/cache

            echo "✅ Development deployment successful"

      # ---------------- KENYA PRODUCTION ----------------
      - name: Deploy to Kenya Production (ta.soja.co.ke)
        if: github.ref == 'refs/heads/master'
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.KENYA_HOST }}
          username: ${{ secrets.KENYA_USER }}
          key: ${{ secrets.KENYA_KEY }}
          port: ${{ secrets.KENYA_PORT }}
          script: |
            cd /var/www/v2.ta.soja.co.ke
            git fetch origin master
            git reset --hard origin/master

            sudo chown -R $USER:www-data storage bootstrap/cache
            sudo chmod -R ug+rwx storage bootstrap/cache

            composer install --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:clear

            sudo chown -R $USER:www-data storage bootstrap/cache
            sudo chmod -R ug+rwx storage bootstrap/cache

            echo "✅ Kenya production deployment successful"

      # ---------------- UGANDA PRODUCTION ----------------
      - name: Deploy to Uganda Production (ta.soja.co.ug)
        if: github.ref == 'refs/heads/production-ug'
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.UGANDA_HOST }}
          username: ${{ secrets.UGANDA_USER }}
          key: ${{ secrets.UGANDA_KEY }}
          script: |
            cd /var/www/ta.soja.co.ug
            git fetch origin production-ug
            git reset --hard origin/production-ug

            sudo chown -R $USER:www-data storage bootstrap/cache
            sudo chmod -R ug+rwx storage bootstrap/cache

            composer install --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:clear

            sudo chown -R $USER:www-data storage bootstrap/cache
            sudo chmod -R ug+rwx storage bootstrap/cache

            echo "✅ Uganda production deployment successful"
