name: Deploy Laravel to Development/Kenya Production and Uganda Production Servers

on:
  push:
    branches:
      - master
      - development
      - production-ug

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Development (dev.soja.co.ke)
        if: github.ref == 'refs/heads/development'
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_KEY }}
          script: |
            cd /var/www/dev.ta.soja.co.ke
            git fetch origin development
            git reset --hard origin/development

            echo "🔧 Fixing permissions before deploy..."
            chown -R $USER:$USER .
            chmod -R ug+rwx storage bootstrap/cache

            echo "📦 Installing composer dependencies..."
            composer install --no-interaction --prefer-dist --optimize-autoloader

            echo "🧱 Running migrations..."
            php artisan migrate --force

            echo "⚡ Optimizing Laravel caches..."
            php artisan optimize:clear || true
            php artisan config:cache || true
            php artisan route:cache || true
            php artisan view:clear || true

            echo "🔧 Final permission fix..."
            chown -R $USER:$USER storage bootstrap/cache
            chmod -R ug+rwx storage bootstrap/cache

            echo "✅ Development deployment successful"
